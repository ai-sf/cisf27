        type: text
        label: Descrizione
      - name: distance
        type: string
        label: Distanza
      - name: capacity
        type: string
        label: Capacità
      - name: rooms
        type: string
        label: Camere
      - name: price
        type: string
        label: Prezzo
      - name: phone
        type: string
        label: Telefono
      - name: whatsapp
        type: string
        label: WhatsApp
      - name: email
        type: string
        label: Email
      - name: features
        type: string
        label: Caratteristiche
        list: true
      - name: image
        type: image
        label: Immagine
        options:
          media: structure-images
    view:
      primary: label
      sort: [label]
      default:
        sort: label
        order: asc

