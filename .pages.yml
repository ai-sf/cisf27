            type: string
            label: ID
          - name: number
            type: string
            label: Numero
          - name: label
            type: string
            label: Etichetta
      - name: aisfStats
        type: object
        label: Statistiche AISF
        list: true
        fields:
          - name: id
            type: string
            label: ID
          - name: number
            type: string
            label: Numero
          - name: label
            type: string
            label: Etichetta
          - name: icon
            type: reference
            label: Icona
            options:
              collection: icon-options
              value: '{lucideId}'
              label: '{label}'

      - name: iapsStats
        type: object
        label: Statistiche IAPS
        list: true
        fields:
          - name: id
            type: string
            label: ID
          - name: number
            type: string
            label: Numero
          - name: label
            type: string
            label: Etichetta
          - name: icon
            type: reference
            label: Icona
