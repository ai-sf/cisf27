                  label: '{label}'

  - name: people
    label: Persone
    type: file
    path: src/data/cms/people.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        label: Nome
      - name: role
        type: reference
        label: Ruolo
        options:
          collection: people-roles
          value: '{id}'
          label: '{label}'
      - name: image
        type: image
        label: Immagine
        options:
          media: committee-images
      - name: email
        type: string
        label: Email
      - name: phone
        type: string
        label: Telefono
      - name: isCommittee
        type: boolean
        label: Mostra nel Comitato
      - name: isContact
        type: boolean
        label: Mostra nei Contatti

  - name: people-roles
    label: Ruoli Persone
    type: collection
    path: src/data/cms/people-roles
    format: json
    filename: '{id}.json'
    fields:
      - name: id
        type: string
        label: ID
      - name: label
        type: string
        label: Etichetta
      - name: description
        type: string
        label: Descrizione Ruolo
    view:
      primary: label

  - name: history
    label: Storia Edizioni
    type: file
