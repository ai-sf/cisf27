        label: Anno
      - name: city
        type: string
        label: Città
      - name: edition
        type: string
        label: Edizione
      - name: details
        type: string
        label: Dettagli
      - name: link
        type: string
        label: Collegamento
      - name: current
        type: boolean
        label: Corrente

  - name: stats
    label: Statistiche
    type: file
    path: src/data/cms/stats.json
    format: json
