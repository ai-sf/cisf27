<text x="340" y="323" text-anchor="middle" font-size="15" font-weight="500" fill="#262A3D" opacity="0.75" style="font-family: sans-serif;;fill:rgb(38, 42, 61);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.75;font-family:sans-serif;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Immagine non disponibile</text>
