name: i18n Sync & Scaffold

on:
  push:
    branches:
      - master
      - dev
      - prod
    paths:
      - 'src/data/cms/**'
      - 'src/config/languages.json'

permissions:
  contents: write

jobs:
  sync-i18n:
    name: Sync Italian Locale & Inlang Settings
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run locale synchronizer from CMS
        run: pnpm run sync:subcatalogs

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/locales/it/ project.inlang/)" ]; then
            git add src/locales/it/ project.inlang/
            git commit -m "chore(i18n): auto-generate locales/it from CMS source [skip ci]"
            git push
          else
            echo "No translation catalog changes detected."
          fi
